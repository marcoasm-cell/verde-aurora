# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem 'sqlite3'
#
default: &default
  adapter: mysql2
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  variables:
    sql_mode: 'traditional'
  username: root
  password: root
  database: verde_aurora_development


production:
  <<: *default
  variables:
    sql_mode: 'traditional'
  username: root
  password: root
  database: verde_aurora_production

